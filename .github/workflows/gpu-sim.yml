name: CUDA tests (simulated H100)

# Optional, non-required check. The runners have no GPU, so this runs the
# tests of the CUDA backend on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behaviour or timing, so it complements real-GPU testing
# and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'vexcl/**'
      - 'tests/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/gpu-sim.yml'

concurrency:
  group: gpu-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-sim:
    name: VEXCL_BACKEND=CUDA on a simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@dda0c8df8d72627c295edbae525354ba2bcb1687 # v0.1.4
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Install Boost, OpenCL headers and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-chrono-dev libboost-date-time-dev libboost-filesystem-dev libboost-program-options-dev libboost-system-dev libboost-thread-dev libboost-test-dev opencl-headers ccache ninja-build

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-cuda-sim-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-cuda-sim-${{ github.ref_name }}-
            ccache-cuda-sim-

      - name: Configure
        # The kernels are compiled to PTX by nvcc when a test runs (sm_90 on
        # the simulated H100). The simulator needs a shared CUDA runtime.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DVEXCL_BACKEND=CUDA \
            -DVEXCL_BUILD_TESTS=ON

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build -j3
          ccache --show-stats

      # simple_cmake_build only checks that the example builds with CMake.
      # fft passes all its test cases but then aborts at exit with a heap
      # corruption error on the simulator, so it is left out for now.
      - name: Test
        working-directory: build
        run: vgpu run ctest --output-on-failure --timeout 1800 -E 'simple_cmake_build|^fft$'

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-cuda-sim-${{ github.ref_name }}-${{ github.run_id }}
